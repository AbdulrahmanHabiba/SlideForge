name: Verify presentation downloads
on:
  push:
    branches: [main, fix/slideshare-public-downloads]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Download the 49-slide public presentation through the API
        run: python tools/smoke_download.py https://www.slideshare.net/slideshow/hospital-fire-safety-250965771/250965771 49
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-presentation-download
          path: artifacts/slideforge-live-download.zip
          retention-days: 3
